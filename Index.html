<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ژماردنی ژمارەکان بۆ منداڵان</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-amber-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const NUMBERS = [
      { id: 1, digitKurdish: "١", digitEn: 1, word: "یەک",bgLight: "#eff6ff", emoji: "🐰" },      { id: 2, digitKurdish: "٢", digitEn: 2, word: "دوو", color: "#15803d", bgLight: "#f0fdf4", emoji: "🕊️" },
      { id: 3, digitKurdish: "٣", digitEn: 3, word: "سێ", color: "#c2410c", bgLight: "#fff7ed", emoji: "🐟" },
      { id: 4, digitKurdish: "٤", digitEn: 4, word: "چوار", color: "#7e22ce", bgemoji: "🐘" },digitEn: 5, word: "پێنج", color: "#b91c1c", bgLight: "#fef2f2", emoji: "🐴" },
      { id: 6, digitKurdish: "٦", digitEn: 6, word: "شەش", color: "#0f766e", bgLight: "#f0fdfa", emoji: "🐱" },
      { id: 7, digitKurdish: "٧", digitEn: 7, word: "حەوت", color: "#be185d", bgLight: "#fdf2f8",},: "هەشت", color: "#1e40af", bgLight: "#eff6ff", emoji: "🦋" },
      { id: 9, digitKurdish: "٩", digitEn: 9, word: "نۆ", color: "#854d0e", bgLight: "#fefce8",},word: "دە", color: "#c2410c", bgLight: "#fff7ed", emoji: "⭐" },
    ];

    function App() {
      const [selectedNum, setSelectedNum] = useState(null);
      const [autoPlaying, setAutoPlaying] = useState(false);
      const autoPlayRef = useRef(null);

      const playTone = (freq) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
      };

      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 0.8;
          u.lang = 'ar-IQ';
          window.speechSynthesis.speak(u);
        }
      };

      const handleNum = (item) => {
        setSelectedNum(item);
        playTone(260 + item.id * 35);
        speak(item.word);
      };

      const toggleAuto = () => {
        if (autoPlaying) {
          clearInterval(autoPlayRef.current);
          setAutoPlaying(false);
          return;
        }
        setAutoPlaying(true);
        let idx = 0;
        autoPlayRef.current = setInterval(() => {
          if (idx >= NUMBERS.length) {
            clearInterval(autoPlayRef.current);
            setAutoPlaying(false);
            return;
          }
          handleNum(NUMBERS[idx]);
          idx++;
        }, 1500);
      };

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4">
          <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 border-4 border-amber-300 text-center">
            <h1 className="text-2xl font-black text-sky-900 mb-2">ژماردنی ژمارەکان لە ١ تا ١٠</h1>
            <p className="text-sm text-slate-500 mb-4">کرتە لە ژمارەکان بکە بۆ فێربوون 😍</p>

            {/* Display */}
            <div className="bg-sky-50 border-2 border-sky-200 rounded-2xl p-4 mb-6 min-h-[110px] flex items-center justify-center">
              {selectedNum ? (
                <div>
                  <div className="text-5xl font-black" style={{ color: selectedNum.color }}>
                    {selectedNum.digitKurdish} <span className="text-3xl">{selectedNum.emoji}</span>
                  </div>
                  <div className="text-2xl font-bold mt-1 text-slate-800">{selectedNum.word}</div>
                </div>
              ) : (
                <span className="text-slate-400 font-bold">ژمارەیەک هەڵبژێرە 👇</span>
              )}
            </div>

            {/* Grid */}
            <div className="grid grid-cols-5 gap-2 mb-6">
              {NUMBERS.map(n => (
                <button
                  key={n.id}
                  onClick={() => handleNum(n)}
                  className="p-2 rounded-xl border-2 flex flex-col items-center active:scale-95 transition-all shadow-sm"
                  style={{ backgroundColor: n.bgLight, borderColor: n.color }}
                >
                  <span className="text-2xl font-black" style={{ color: n.color }}>{n.digitKurdish}</span>
                  <span className="text-xs font-bold text-slate-700">{n.word}</span>
                </button>
              ))}
            </div>

            {/* Controls */}
            <button
              onClick={toggleAuto}
              className={w-full py-3 rounded-2xl font-bold text-white shadow-lg transition-all ${autoPlaying ? 'bg-rose-500' : 'bg-emerald-500'}}
            >
              {autoPlaying ? 'وەستاندن' : 'ژماردنی ئۆتۆماتیکی (Auto)'}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
```
